<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>October 18, 2026 (passphrase hint: +126 after 12th of may)</title>

    <meta name="theme-color" content="#f8fafc">
    <meta name="description" content="Open or copy the saved link.">

    <style>
        :root {
            color-scheme: light;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e2e8f0;
            --code-background: #f1f5f9;
            --code-text: #4338ca;
            --success: #15803d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(199, 210, 254, 0.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(186, 230, 253, 0.35),
                    transparent 35%
                ),
                var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .card {
            padding: clamp(24px, 5vw, 44px);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;
            box-shadow:
                0 20px 60px rgba(15, 23, 42, 0.06),
                0 2px 8px rgba(15, 23, 42, 0.025);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            padding: 8px 13px;
            border: 1px solid #e0e7ff;
            border-radius: 999px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6366f1;
        }

        h1 {
            margin: 0 0 16px;
            color: #0f172a;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 750;
            line-height: 1.25;
            letter-spacing: -0.045em;
            overflow-wrap: anywhere;
        }

        .description {
            margin: 0 0 32px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
        }

        .section-label {
            display: block;
            margin-bottom: 10px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        .url-box {
            position: relative;
            margin-bottom: 24px;
            padding: 18px;
            overflow-wrap: anywhere;
            word-break: break-word;
            background: var(--code-background);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .url-box code {
            color: var(--code-text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            line-height: 1.9;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            flex: 1 1 160px;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border: 1px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
            transition:
                background 180ms ease,
                border-color 180ms ease,
                box-shadow 180ms ease,
                transform 180ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible {
            outline: 3px solid rgba(99, 102, 241, 0.3);
            outline-offset: 3px;
        }

        .button-primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.16);
        }

        .button-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.22);
        }

        .button-secondary {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #334155;
        }

        .button-secondary:hover {
            background: #f8fafc;
            border-color: #a5b4fc;
        }

        .feedback {
            min-height: 20px;
            margin: 16px 0 0;
            color: var(--success);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .feedback:empty {
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }

            .description {
                margin-bottom: 26px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
                flex-basis: auto;
            }

            .url-box {
                padding: 14px;
            }

            .url-box code {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card" aria-labelledby="page-heading">

            <div class="badge">
                <span class="badge-dot" aria-hidden="true"></span>
                Saved Link
            </div>

            <h1 id="page-heading">October 18, 2026 (passphrase hint: +126 after 12th of may)</h1>

            <p class="description">
                Your link is ready. Open it in a new tab or copy the complete URL
                to your clipboard for later use.
            </p>

            <label class="section-label" for="target-url">Target URL</label>

            <div class="url-box">
                <code id="target-url">https://burnpony.app/n/4Hh-ixwcs978KkNrK3L3Yg#GqAFwAvAUr1UWcGHc71ZS1TQhhG-5Sd0E3SgtIH9ar0.p</code>
            </div>

            <div class="actions">
                <a
                    class="button button-primary"
                    href="https://burnpony.app/n/4Hh-ixwcs978KkNrK3L3Yg#GqAFwAvAUr1UWcGHc71ZS1TQhhG-5Sd0E3SgtIH9ar0.p"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M14 3h7v7"></path>
                        <path d="M10 14 21 3"></path>
                        <path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"></path>
                    </svg>
                    Open Link
                </a>

                <button
                    class="button button-secondary"
                    id="copy-button"
                    type="button"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="8" y="8" width="13" height="13" rx="2"></rect>
                        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    <span id="copy-button-text">Copy Link</span>
                </button>
            </div>

            <p
                class="feedback"
                id="feedback"
                role="status"
                aria-live="polite"
            ></p>

        </section>
    </main>

    <script>
        (() => {
            "use strict";

            const TARGET_URL =
                "https://burnpony.app/n/4Hh-ixwcs978KkNrK3L3Yg#GqAFwAvAUr1UWcGHc71ZS1TQhhG-5Sd0E3SgtIH9ar0.p";

            const copyButton = document.getElementById("copy-button");
            const copyButtonText = document.getElementById("copy-button-text");
            const feedback = document.getElementById("feedback");

            let feedbackTimer;
            let buttonTimer;

            function showFeedback(message, isError = false) {
                feedback.textContent = message;
                feedback.style.color = isError ? "#b91c1c" : "#15803d";

                clearTimeout(feedbackTimer);

                feedbackTimer = setTimeout(() => {
                    feedback.textContent = "";
                }, 2500);
            }

            async function copyLink() {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(TARGET_URL);
                    } else {
                        const textArea = document.createElement("textarea");

                        textArea.value = TARGET_URL;
                        textArea.setAttribute("readonly", "");
                        textArea.style.position = "fixed";
                        textArea.style.top = "0";
                        textArea.style.left = "-9999px";
                        textArea.style.opacity = "0";

                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        textArea.setSelectionRange(0, textArea.value.length);

                        const copied = document.execCommand("copy");
                        textArea.remove();

                        if (!copied) {
                            throw new Error("Copy command was unsuccessful.");
                        }
                    }

                    copyButtonText.textContent = "Copied!";
                    showFeedback("✓ Link copied to clipboard!");

                    clearTimeout(buttonTimer);

                    buttonTimer = setTimeout(() => {
                        copyButtonText.textContent = "Copy Link";
                    }, 2500);

                } catch (error) {
                    showFeedback(
                        "Unable to copy automatically. Please copy the URL manually.",
                        true
                    );
                }
            }

            copyButton.addEventListener("click", copyLink);
        })();
    </script>
</body>
</html>
