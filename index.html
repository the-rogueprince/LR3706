<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>October 18, 2026 (passphrase hint: +126 after 12th of may)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .mono-font {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-sky-500/30">

  <!-- Main Card Container -->
  <main class="w-full max-w-xl bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm flex flex-col gap-6 text-center">
    
    <!-- Title Section -->
    <header class="flex flex-col gap-3">
      <div class="inline-flex items-center justify-center gap-2 self-center px-3 py-1 rounded-full border border-sky-500/30 bg-sky-500/10 text-sky-400 text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
        Target Reference
      </div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-snug">
        October 18, 2026 (passphrase hint: +126 after 12th of may)
      </h1>
    </header>

    <!-- Target URL Display Box -->
    <div class="text-left bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col gap-2">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Destination URL</span>
      <div id="targetUrlText" class="mono-font text-xs sm:text-sm text-sky-400 break-all select-all leading-relaxed">
        https://burnpony.app/n/HRMEC-3Rba-eSngqVcSMfA#xvbP6eaYdME5BF9ikHmwoJipf99EBoLY2VasrSAK5Z4.pr
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
      <!-- Open Link Button -->
      <a 
        href="https://burnpony.app/n/HRMEC-3Rba-eSngqVcSMfA#xvbP6eaYdME5BF9ikHmwoJipf99EBoLY2VasrSAK5Z4.pr" 
        target="_blank" 
        rel="noopener noreferrer"
        class="w-full sm:w-1/2 px-6 py-3.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm transition shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2 active:scale-[0.98]"
      >
        <span>Open Link</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>

      <!-- Copy Link Button -->
      <button 
        id="copyBtn" 
        type="button"
        class="w-full sm:w-1/2 px-6 py-3.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition flex items-center justify-center gap-2 cursor-pointer active:scale-[0.98]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span id="copyBtnText">Copy Link</span>
      </button>
    </div>

    <!-- Feedback Notice -->
    <div id="copyToast" class="text-xs text-emerald-400 font-medium h-4 transition-opacity duration-200 opacity-0">
      Copied to clipboard!
    </div>

  </main>

  <!-- Script for Clipboard Functionality -->
  <script>
    const targetUrl = "https://burnpony.app/n/HRMEC-3Rba-eSngqVcSMfA#xvbP6eaYdME5BF9ikHmwoJipf99EBoLY2VasrSAK5Z4.pr";
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const copyToast = document.getElementById('copyToast');

    copyBtn.addEventListener('click', async function() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(targetUrl);
        } else {
          // Fallback for older browsers or non-HTTPS environments
          const textArea = document.createElement('textarea');
          textArea.value = targetUrl;
          textArea.style.position = 'fixed';
          textArea.style.left = '-999999px';
          textArea.style.top = '-999999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }

        // Show success state
        copyBtnText.textContent = "Copied!";
        copyToast.classList.remove('opacity-0');
        
        setTimeout(() => {
          copyBtnText.textContent = "Copy Link";
          copyToast.classList.add('opacity-0');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy: ', err);
      }
    });
  </script>
</body>
</html>
